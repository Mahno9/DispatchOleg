services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      - ADMIN_LOGIN=${ADMIN_LOGIN:?set in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set in .env}
      - COOKIE_SECRET=${COOKIE_SECRET:?set in .env}
      - QR_SECRET=${QR_SECRET:?set in .env}
      - NO_QR=${NO_QR:-}
    volumes:
      - ../data:/data
    ports:
      - '127.0.0.1:8081:8080'
    mem_limit: 400m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      # No curl/wget in node:24-slim — use Node itself to hit /api/health.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set in .env}
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
